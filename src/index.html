<!DOCTYPE html>
<html lang="en" dir="auto">
    <head>
        <title>New tab</title>

        <meta charset="utf-8" />
        <meta name="theme-color" content="#000" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
        />

        <!-- default icon -->
        <!-- icon -->
        <!-- manifest -->
        <!-- webext-storage -->

        <link rel="stylesheet" href="src/styles/style.css" />
        <style type="text/css" id="styles"></style>
        <style type="text/css" id="fontface"></style>

        <script src="src/scripts/help-mode.js" defer></script>
        <script src="src/scripts/main.js" defer></script>
    </head>

    <body class="init loading">
        <dialog id="contextmenu">
            <form id="editlink-form">
                <label id="edit-title" autofocus>
                    <span class="trn">Title</span>
                    <input
                        id="e-title"
                        type="text"
                        name="e-title"
                        maxlength="64"
                        autocomplete="off"
                        placeholder="Example"
                    />
                </label>

                <label id="edit-url">
                    <span class="trn">Link</span>
                    <input
                        id="e-url"
                        type="text"
                        name="e-url"
                        maxlength="512"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        placeholder="https://example.com"
                    />
                </label>

                <label id="edit-icon">
                    <span class="trn">Icon</span>
                    <select name="edit-icon" id="e-icon-type">
                        <option value="auto" class="trn">Website favicon</option>
                        <option value="file" class="trn">Local file</option>
                        <option value="url" class="trn">URL</option>
                    </select>
                </label>

                <label id="edit-icon-file">
                    <span class="trn">File</span>
                    <input id="e-icon-file" type="file" name="edit-icon-file" accept="image/*" />
                    <span id="e-icon-file-label" class="trn">No file chosen</span>
                </label>

                <label id="edit-icon-url">
                    <span class="trn">URL</span>
                    <input
                        id="e-icon-url"
                        type="url"
                        name="e-icon-url"
                        maxlength="7600"
                        autocomplete="off"
                        placeholder="https://example.com/favicon.ico"
                    />
                </label>

                <hr />

                <!-- <button type="submit" class="trn" id="edit-inputs">Submit from inputs</button> -->
                <button type="submit" class="btn-red" id="edit-delete" formnovalidate>
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-delete"></use>
                    </svg>

                    <span class="trn">Delete something</span>
                </button>

                <button type="submit" id="edit-refresh">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-refresh"></use>
                    </svg>

                    <span class="trn">Refresh icon</span>
                </button>

                <button type="submit" id="edit-add">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-add"></use>
                    </svg>

                    <span class="trn">Add something</span>
                </button>

                <button type="submit" id="edit-pin">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-locked"></use>
                    </svg>

                    <span class="trn">Pin group</span>
                </button>

                <button type="submit" id="edit-unpin">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-unlocked"></use>
                    </svg>

                    <span class="trn">Unpin group</span>
                </button>

                <button type="submit" id="edit-unfolder">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-undo-2"></use>
                    </svg>

                    <span class="trn">Remove from folder</span>
                </button>

                <button type="submit" id="edit-apply">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-save"></use>
                    </svg>
                    <span class="trn">Apply changes</span>
                </button>
                <button type="submit" class="trn" id="edit-synced">Synced links cannot be modified</button>
            </form>

            <div id="contextActions">
                <button
                    data-action="openTheseSettings"
                    data-attribute="time_title"
                    title="Open the time settings"
                    aria-label="Open the time settings"
                >
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-time"></use>
                    </svg>
                    <span class="trn">Edit time settings</span>
                </button>

                <button
                    data-action="openTheseSettings"
                    data-attribute="quotes_title"
                    title="Open the quotes settings"
                    aria-label="Open the quotes settings"
                >
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-quotes"></use>
                    </svg>
                    <span class="trn">Edit quotes settings</span>
                </button>

                <button
                    data-action="openTheseSettings"
                    data-attribute="background_title"
                    title="Open the background settings"
                    aria-label="Open the background settings"
                >
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-background"></use>
                    </svg>
                    <span class="trn">Edit background settings</span>
                </button>

                <button
                    data-action="openTheseSettings"
                    data-attribute="searchbar_title"
                    title="Open the search bar settings"
                    aria-label="Open the search bar settings"
                >
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-searchbar"></use>
                    </svg>
                    <span class="trn">Edit search bar settings</span>
                </button>

                <!-- to be added when new move elem is done -->
                <!-- <button
                    data-action="openTheseSettings"
                    data-attribute="layout_title"
                    title="Open the layout settings"
                    aria-label="Open the layout settings"
                >
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-layout"></use>
                    </svg>

                    <span class="trn">Edit layout settings</span>
                </button> -->

                <button
                    data-action="openTheseSettings"
                    data-attribute="links_title"
                    title="Open the quick links settings"
                    aria-label="Open the quick links settings"
                >
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-links"></use>
                    </svg>
                    <span class="trn">Edit quick links settings</span>
                </button>

                <button data-action="add-new-link" title="Create a new quick link" aria-label="Create a new quick link">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-add"></use>
                    </svg>
                    <span class="trn">Add new quick link</span>
                </button>
            </div>

            <button
                id="b_interface-quotes-refresh"
                class="refresh-btn"
                title="Switch to the next quote"
                aria-label="Switch to the next quote"
            >
                <span class="iconContainer">
                    <svg class="contextmenu-icon" aria-hidden="true">
                        <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-background-refresh"></use>
                    </svg>
                </span>
                <span class="trn">Next quote</span>
            </button>

            <div id="background-actions">
                <hr />
                <a id="download-background"></a>

                <div class="buttons">
                    <button
                        id="b_interface-background-mute"
                        class="not-safari"
                        title="Enable or disable background video sound"
                        aria-label="Enable or disable background video sound"
                    >
                        <span id="interface-background-mute-icon" class="iconContainer">
                            <svg class="contextmenu-icon" aria-hidden="true">
                                <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-mute"></use>
                            </svg>
                        </span>

                        <span class="trn" id="interface-background-mute-string">Mute video background</span>

                        <span id="interface-background-unmute-icon" class="iconContainer">
                            <svg class="contextmenu-icon" aria-hidden="true">
                                <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-unmute"></use>
                            </svg>
                        </span>

                        <span class="trn" id="interface-background-unmute-string">Unmute video background</span>
                    </button>

                    <button
                        id="b_interface-background-download"
                        title="Download the current background"
                        aria-label="Download the current background"
                        class="idle"
                    >
                        <span id="idle-download" class="iconContainer">
                            <svg class="contextmenu-icon" aria-hidden="true">
                                <use
                                    href="src/assets/interface/contextmenu-sprites.svg#contextmenu-background-download"
                                ></use>
                            </svg>
                        </span>

                        <span id="is-downloading" class="iconContainer">
                            <svg
                                class="spin"
                                fill="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z"
                                    opacity=".25"
                                />
                                <path
                                    d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z"
                                />
                            </svg>
                        </span>
                        <span class="trn">Download background</span>
                    </button>

                    <button
                        id="b_interface-background-pause"
                        title="Lock the current background"
                        aria-label="Lock the current background"
                    >
                        <span id="interface-background-pause-icon" class="iconContainer">
                            <svg class="contextmenu-icon" aria-hidden="true">
                                <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-locked"></use>
                            </svg>
                        </span>

                        <span class="trn" id="interface-background-pause-string">Lock current background</span>

                        <span id="interface-background-play-icon" class="iconContainer">
                            <svg class="contextmenu-icon" aria-hidden="true">
                                <use href="src/assets/interface/contextmenu-sprites.svg#contextmenu-unlocked"></use>
                            </svg>
                        </span>

                        <span class="trn" id="interface-background-play-string">Unlock current background</span>
                    </button>

                    <button
                        id="b_interface-background-refresh"
                        class="refresh-btn"
                        title="Change to another background"
                        aria-label="Change to another background"
                    >
                        <span class="iconContainer">
                            <svg class="contextmenu-icon" aria-hidden="true">
                                <use
                                    href="src/assets/interface/contextmenu-sprites.svg#contextmenu-background-refresh"></use>
                            </svg>
                        </span>
                        <span class="trn">Next background</span>
                    </button>
                </div>
            </div>
        </dialog>

        <dialog id="element-mover" class="hidden">
            <div id="grid-selection">
                <p class="trn">Editing</p>
                <h3 id="mover-title" class="trn">No selection</h3>
            </div>

            <div>
                <p class="trn">Grid position</p>
                <div id="grid-mover" class="mover">
                    <button type="button" data-row="-1">
                        <i class="chevron rotate-half"></i>
                    </button>
                    <button type="button" data-col="-1">
                        <i class="chevron rotate-quart"></i>
                    </button>
                    <button type="button" data-col="1">
                        <i class="chevron rotate-quart-r"></i>
                    </button>
                    <button type="button" data-row="1">
                        <i class="chevron"></i>
                    </button>
                </div>
            </div>
            <div id="grid-spanner-container">
                <button class="grid-spanner trn" id="grid-span-rows">Fill row</button>
                <button class="grid-spanner trn" id="grid-span-cols">Fill column</button>
            </div>
            <div>
                <p class="trn">Box alignment</p>
                <div id="box-alignment-mover" class="mover">
                    <button type="button" data-align="baseline">
                        <i class="box-corner"></i>
                    </button>
                    <button type="button" data-align="baseline center">
                        <i class="box-side rotate-half"></i>
                    </button>
                    <button type="button" data-align="baseline end">
                        <i class="box-corner rotate-quart"></i>
                    </button>
                    <button type="button" data-align="center baseline">
                        <i class="box-side rotate-quart"></i>
                    </button>
                    <button type="button" data-align="center">
                        <i class="box-center"></i>
                    </button>
                    <button type="button" data-align="center end">
                        <i class="box-side rotate-quart-r"></i>
                    </button>
                    <button type="button" data-align="end baseline">
                        <i class="box-corner rotate-quart-r"></i>
                    </button>
                    <button type="button" data-align="end center">
                        <i class="box-side"></i>
                    </button>
                    <button type="button" data-align="end">
                        <i class="box-corner rotate-half"></i>
                    </button>
                </div>
            </div>
            <div>
                <p class="trn">Text alignment</p>
                <div id="text-alignment-mover" class="mover">
                    <button data-align="left">
                        <i class="text-left"></i>
                    </button>
                    <button data-align="center">
                        <i class="text-center"></i>
                    </button>
                    <button data-align="right">
                        <i class="text-right"></i>
                    </button>
                </div>
            </div>

            <div id="close-mover-wrapper">
                <hr />

                <button id="b_resetlayout" class="trn btn-red">Reset layout</button>
                <button id="close-mover" class="trn">Done</button>
            </div>
        </dialog>

        <div id="background-wrapper" class="hidden" data-type="images">
            <div id="background-media"></div>
            <div id="background-color"></div>
        </div>

        <main id="interface">
            <div id="time">
                <div id="time-container" data-hide="clock">
                    <div id="clock-wrapper" class="clock-wrapper" data-index="0">
                        <h1 class="digital" data-hide="clock">
                            <span class="digital-hh-leading-zero">0</span><span
                                class="digital-hh"
                            ></span><span
                                class="digital-hh-separator"
                            >:</span><span
                                class="digital-mm"
                            ></span><span
                                class="digital-mm-separator"
                            >:</span><span
                                class="digital-ss"
                            >
                                <!-- prettier-ignore -->
                            </span><span class="digital-ampm"><span class="digital-am">am</span><span class="digital-pm"
                                >pm</span></span>
                        </h1>

                        <p class="clock-region">Paris</p>

                        <p class="clock-date" data-hide="date">
                            <span class="clock-date-aa"></span><span class="clock-date-aa-separator"></span>
                            <span class="clock-date-bb"></span>
                            <span class="clock-date-bb-separator"></span>
                            <span class="clock-date-cc"></span>
                            <span class="clock-date-secondary"></span>
                        </p>
                    </div>
                </div>
            </div>

            <form id="sb_container" class="hidden">
                <div id="searchbar-wrapper">
                    <input
                        id="searchbar"
                        type="text"
                        name="searchbar"
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="Search bar"
                    />

                    <div id="sb-buttons">
                        <button id="sb_empty" aria-label="Empty search" type="button" disabled>✕</button>

                        <hr />

                        <button id="sb_submit" aria-label="Submit search" type="submit" disabled>
                            <svg class="default-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                <path
                                    fill="currentColor"
                                    d="M495 466 385 356a209 209 0 0 0-14-283 209 209 0 0 0-298 0 209 209 0 0 0 0 298 210 210 0 0 0 283 14l110 110a20 20 0 1 0 29-29zM102 342a169 169 0 0 1 0-240 169 169 0 0 1 240 0 169 169 0 0 1 0 240 169 169 0 0 1-240 0z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <ul id="sb-suggestions"></ul>
            </form>

            <div id="linkblocks">
                <div id="link-mini">
                    <div></div>
                </div>
            </div>

            <div id="quotes_container" class="hidden">
                <p id="quote"></p>
                <p id="author"></p>
                <a id="quote-credit" href="https://zenquotes.io/" target="_blank"
                    rel="noreferrer">명언 제공: ZenQuotes</a>
            </div>
        </main>

        <div id="credit-container">
            <div id="credit"></div>
        </div>

        <div id="show-settings" data-hide="settingsicon">
            <button aria-label="Toggle settings menu" title="Toggle settings menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="199.66" height="199.93" viewBox="0 0 52.83 52.9">
                    <path
                        fill="var(--icon-color, #fff)"

                    />
                </svg>
            </button>
        </div>

        <aside id="settings" class="init hidden" style="display: none">
            <!-- settings -->
        </aside>

        <div id="templates">
            <template id="bookmarks-dialog-template">
                <dialog id="bookmarks">
                    <div id="bookmarks-header">
                        <div id="bookmarks-intro">
                            <!-- deno-fmt-ignore -->
                            <span class="trn">
                                Browser bookmarks can be imported into Quick Links.
                            </span>
                        </div>

                        <div id="bookmarks-buttons">
                            <button id="bmk_close" class="trn btn-red">Close</button>
                            <button id="bmk_apply" class="trn" disabled>Import selection</button>
                        </div>
                    </div>

                    <div id="bookmarks-container"></div>
                </dialog>
            </template>

            <template id="bookmarks-folder-template">
                <div class="bookmarks-folder">
                    <div class="bookmarks-folder-title">
                        <h2>
                            <span class="bookmarks-folder-title-content"></span>
                            <span class="bookmarks-folder-title-synced trn">(synced)</span>
                        </h2>
                        <div>
                            <button class="trn b_bookmarks-folder-select">Select group</button>
                            <button class="trn b_bookmarks-folder-sync" disabled>Sync with browser</button>
                        </div>
                    </div>
                    <ol></ol>
                </div>
            </template>

            <template id="bookmarks-item-template">
                <li>
                    <button>
                        <img draggable="false" loading="lazy" alt="" />
                        <p class="bookmark-title"></p>
                        <p class="bookmark-url"></p>
                    </button>
                </li>
            </template>

            <template id="link-group-template">
                <div class="link-group">
                    <ul class="link-list"></ul>
                    <button class="link-title"></button>
                </div>
            </template>

            <template id="link-elem-template">
                <li class="link link-elem">
